<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workshop — App Launcher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div id="login-screen" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:9999;backdrop-filter:blur(4px)">
  <div style="background:#f1efe8;border-radius:12px;padding:40px;max-width:360px;width:90%;box-shadow:0 20px 50px rgba(0,0,0,0.3)">
    <h1 style="margin-bottom:12px;font-size:24px;font-weight:600;color:#1c1e22">Workshop</h1>
    <p style="color:#73706a;margin-bottom:20px;font-size:14px">Sign in to access your apps</p>
    <form id="login-form" style="display:flex;flex-direction:column;gap:12px">
      <input id="login-email" type="email" placeholder="Email" required style="padding:11px 14px;border:1px solid #e3ddd0;border-radius:8px;font-size:14px;font-family:inherit">
      <input id="login-password" type="password" placeholder="Password" required style="padding:11px 14px;border:1px solid #e3ddd0;border-radius:8px;font-size:14px;font-family:inherit">
      <button type="submit" style="padding:12px;background:#1c1e22;color:white;border:none;border-radius:8px;font-weight:600;cursor:pointer">Sign In</button>
      <button type="button" id="signup-toggle" style="padding:12px;background:transparent;color:#d9542b;border:1px solid #e3ddd0;border-radius:8px;font-weight:600;cursor:pointer">Create Account</button>
      <div id="login-error" style="color:#c0492f;font-size:13px;min-height:20px"></div>
    </form>
  </div>
</div>

<div id="app-screen" style="display:none">
  <button id="logout-btn" style="position:fixed;top:16px;right:16px;padding:8px 16px;background:#d9542b;color:white;border:none;border-radius:6px;font-weight:600;cursor:pointer;font-size:12px;z-index:1000">Logout</button>
  
  <!-- ORIGINAL APP CONTENT STARTS HERE -->
<style>
  :root{
    --paper:#f1efe8;--ink:#1c1e22;--muted:#73706a;--faint:#a8a399;
    --card:#fbfaf6;--line:#e3ddd0;--accent:#d9542b;--accent-soft:#f6e3da;
    --grid:rgba(28,30,34,.045);--shadow:0 1px 2px rgba(28,30,34,.05),0 10px 30px rgba(28,30,34,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'DM Sans',sans-serif;color:var(--ink);min-height:100vh;padding:48px 24px 80px;
    background:linear-gradient(var(--grid) 1px,transparent 1px) 0 0/26px 26px,
      linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/26px 26px,
      radial-gradient(900px 480px at 92% -8%,rgba(217,84,43,.07),transparent 60%),var(--paper);
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:1000px;margin:0 auto}
  header{margin-bottom:28px}
  .eyebrow{font-family:'JetBrains Mono';font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--accent)}
  h1{font-family:'Syne';font-weight:800;font-size:clamp(34px,6vw,58px);letter-spacing:-.02em;line-height:.95;margin:10px 0 8px}
  header p{color:var(--muted);font-size:14.5px}

  .composer{display:flex;gap:10px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);
    border-radius:16px;padding:12px;box-shadow:var(--shadow);margin-bottom:26px}
  .composer input{flex:1;min-width:150px;background:transparent;border:1px solid var(--line);border-radius:11px;
    padding:12px 14px;font-family:'DM Sans';font-size:15px;color:var(--ink)}
  .composer input.url{font-family:'JetBrains Mono';font-size:13px}
  .composer input:focus{outline:none;border-color:var(--accent)}
  .composer button{border-radius:11px;padding:0 20px;font-family:'Syne';font-weight:700;font-size:14px;cursor:pointer;transition:transform .12s,background .15s,color .15s}
  .composer button:active{transform:scale(.97)}
  #addBtn{background:var(--ink);color:var(--paper);border:none}
  #addBtn.editing{background:var(--accent)}
  #sectionBtn{background:transparent;border:1px dashed var(--line);color:var(--muted)}
  #sectionBtn:hover{border-color:var(--accent);color:var(--accent)}

  #board{display:flex;flex-direction:column;gap:4px}
  .section-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-bottom:14px}

  /* section header / divider */
  .header{display:flex;align-items:center;gap:11px;margin:18px 2px 10px;cursor:grab;touch-action:none;user-select:none}
  .header:first-child{margin-top:0}
  .header .grip{color:var(--faint);font-size:13px;letter-spacing:-2px;cursor:grab}
  .header .htitle{font-family:'Syne';font-weight:800;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);outline:none;padding:2px 0;min-width:30px}
  .header .htitle:focus{color:var(--accent)}
  .header .rule{flex:1;height:1px;background:var(--line)}
  .header .hx{color:var(--faint);cursor:pointer;font-size:16px;line-height:1}
  .header .hx:hover{color:var(--accent)}
  .header.ghost{opacity:.3}

  /* app chip */
  .chip{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;
    box-shadow:var(--shadow);cursor:pointer;transition:transform .16s,border-color .16s,box-shadow .16s;
    display:flex;flex-direction:column;gap:11px;min-height:104px;touch-action:none;user-select:none}
  .chip:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 2px 4px rgba(28,30,34,.06),0 16px 40px rgba(217,84,43,.12)}
  .chip.ghost{opacity:.3}
  .chip .fav{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:#fff;object-fit:cover;flex:none}
  .chip .favball{width:32px;height:32px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:'Syne';font-weight:800;font-size:15px;flex:none}
  .chip .title{font-family:'Syne';font-weight:700;font-size:17px;letter-spacing:-.01em;line-height:1.15;word-break:break-word}
  .chip .host{font-family:'JetBrains Mono';font-size:11.5px;color:var(--muted);word-break:break-all}
  .chip .arrow{position:absolute;top:14px;right:14px;font-size:15px;color:var(--faint);transition:color .15s,transform .15s}
  .chip:hover .arrow{color:var(--accent);transform:translate(2px,-2px)}
  .chip .tools{position:absolute;bottom:12px;right:12px;display:flex;gap:6px;opacity:0;transition:opacity .15s}
  .chip:hover .tools{opacity:1}
  .chip .tools b{font-family:'DM Sans';font-weight:600;font-size:11px;background:#fff;border:1px solid var(--line);border-radius:7px;padding:3px 8px;color:var(--muted);cursor:pointer}
  .chip .tools b:hover{color:var(--accent);border-color:var(--accent)}
  .chip .tools b.del:hover{color:#fff;background:var(--accent);border-color:var(--accent)}

  .empty{text-align:center;color:var(--faint);padding:50px 0;font-size:15px;border:1.5px dashed var(--line);border-radius:18px}
  .floating{position:fixed;z-index:999;pointer-events:none;box-shadow:0 16px 40px rgba(28,30,34,.25);transform:rotate(-1.5deg)}
  footer{margin-top:34px;text-align:center;color:var(--faint);font-size:12px;font-family:'JetBrains Mono'}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Workshop</div>
    <h1>App Launcher</h1>
    <p>Add apps, drop in section dividers, and drag anything up or down to organize.</p>
  </header>

  <div class="composer">
    <input id="title" type="text" placeholder="App name" autocomplete="off">
    <input id="url" class="url" type="text" placeholder="https://…" autocomplete="off">
    <button id="addBtn">Add</button>
    <button id="sectionBtn">+ Section divider</button>
  </div>

  <div id="board"></div>

  <footer>Saves to this browser for now · swap the db layer for Supabase to sync across devices</footer>
</div>

<script>
// Supabase setup FIRST
const SUPABASE_URL='https://avbwykhmzuvtglqmkaqu.supabase.co';
const SUPABASE_KEY='sb_publishable_0Fpu06kWZrWBuX6rQsFNpQ_zw7oxZA6';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

/* ===== DATA LAYER — Supabase ===== */
const db={
  async load(){
    try{
      const{data:{user}}=await sb.auth.getUser();
      if(!user)return null;
      const{data:apps,error}=await sb.from('launcher_apps').select('*').eq('user_id',user.id).order('order_idx');
      if(error)throw error;
      return apps||null;
    }catch(e){
      console.error('Load failed:',e);
      return null;
    }
  },
  async save(list){
    try{
      const{data:{user}}=await sb.auth.getUser();
      if(!user)return;
      for(let i=0;i<list.length;i++){
        const item=list[i];
        item.user_id=user.id;
        if(!item.id)item.id=crypto.randomUUID();
        item.order_idx=i;
        if(item.deleted){
          await sb.from('launcher_apps').delete().eq('id',item.id);
        }else{
          delete item.deleted;
          await sb.from('launcher_apps').upsert(item);
        }
      }
    }catch(e){
      console.error('Save failed:',e);
    }
  }
};

/* items: {id, type:'app'|'header', title, url?} in display order */
let items=[];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
let editingId=null;
const title=document.getElementById('title'),url=document.getElementById('url'),addBtn=document.getElementById('addBtn');

function normUrl(u){u=u.trim();if(!u)return'';if(!/^https?:\/\//i.test(u))u='https://'+u;return u;}
function hostOf(u){try{return new URL(u).hostname.replace(/^www\./,'');}catch{return u;}}
function favUrl(u){try{return 'https://www.google.com/s2/favicons?domain='+new URL(u).hostname+'&sz=64';}catch{return'';}}

async function init(){items=await db.load();render();}
async function persist(){await db.save(items);}

async function submitApp(){const t=title.value.trim(),u=normUrl(url.value);if(!t||!u)return;
  if(editingId){const a=items.find(x=>x.id===editingId);if(a){a.title=t;a.url=u;}editingId=null;addBtn.textContent='Add';addBtn.classList.remove('editing');}
  else items.push({id:uid(),type:'app',title:t,url:u});
  title.value='';url.value='';title.focus();await persist();render();}
async function addSection(){const id=uid();items.push({id,type:'header',title:'New section'});await persist();render();
  const el=document.querySelector(`.header[data-id="${id}"] .htitle`);if(el){el.focus();document.getSelection().selectAllChildren(el);}}
function startEditApp(id){const a=items.find(x=>x.id===id);if(!a)return;editingId=id;title.value=a.title;url.value=a.url;addBtn.textContent='Update';addBtn.classList.add('editing');title.focus();}
async function del(id){const a=items.find(x=>x.id===id);const what=a?(a.type==='header'?'section "'+a.title+'"':'"'+a.title+'"'):'this';
  if(confirm('Remove '+what+'?')){items=items.filter(x=>x.id!==id);await persist();render();}}

function chipEl(a){
  const c=document.createElement('div');c.className='chip';c.dataset.id=a.id;
  const letter=(a.title[0]||'?').toUpperCase();
  c.innerHTML=`<img class="fav" alt="" src="${favUrl(a.url)}">
    <div><div class="title"></div><div class="host"></div></div>
    <span class="arrow">↗</span>
    <div class="tools"><b data-act="edit">edit</b><b class="del" data-act="del">delete</b></div>`;
  const img=c.querySelector('.fav');img.onerror=()=>{const b=document.createElement('div');b.className='favball';b.textContent=letter;img.replaceWith(b);};
  c.querySelector('.title').textContent=a.title;c.querySelector('.host').textContent=hostOf(a.url);
  c.addEventListener('click',e=>{if(e.target.dataset.act||c.dataset.dragged)return;window.open(a.url,'_blank','noopener');});
  c.querySelector('[data-act="edit"]').addEventListener('click',e=>{e.stopPropagation();startEditApp(a.id);});
  c.querySelector('[data-act="del"]').addEventListener('click',e=>{e.stopPropagation();del(a.id);});
  c.addEventListener('pointerdown',e=>startDrag(e,a.id,c));
  return c;
}
function headerEl(h){
  const el=document.createElement('div');el.className='header';el.dataset.id=h.id;
  el.innerHTML=`<span class="grip">⠿</span><span class="htitle" contenteditable="true" spellcheck="false"></span><span class="rule"></span><b class="hx" data-act="del">×</b>`;
  const ht=el.querySelector('.htitle');ht.textContent=h.title;
  ht.addEventListener('blur',async()=>{h.title=ht.textContent.trim()||'Section';await persist();});
  ht.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();ht.blur();}});
  el.querySelector('[data-act="del"]').addEventListener('click',e=>{e.stopPropagation();del(h.id);});
  el.addEventListener('pointerdown',e=>startDrag(e,h.id,el));
  return el;
}
function render(){
  const board=document.getElementById('board');board.innerHTML='';
  if(!items.length){board.innerHTML='<div class="empty">Nothing yet — add an app or a section divider above ↑</div>';return;}
  let i=0;
  while(i<items.length){
    if(items[i].type==='header'){board.appendChild(headerEl(items[i]));i++;}
    else{const grid=document.createElement('div');grid.className='section-grid';
      while(i<items.length&&items[i].type==='app'){grid.appendChild(chipEl(items[i]));i++;}
      board.appendChild(grid);}
  }
}

/* drag reorder for both chips and headers (mouse + touch) */
let drag=null;
function startDrag(e,id,el){
  if(e.target.dataset.act||e.target.isContentEditable)return;
  const r=el.getBoundingClientRect();
  drag={id,el,moved:false,sx:e.clientX,sy:e.clientY,dx:e.clientX-r.left,dy:e.clientY-r.top,w:r.width,clone:null};
  window.addEventListener('pointermove',onMove);window.addEventListener('pointerup',onUp);
}
function onMove(e){
  if(!drag)return;
  if(!drag.moved){if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<6)return;
    drag.moved=true;const r=drag.el.getBoundingClientRect();const cl=drag.el.cloneNode(true);
    cl.classList.add('floating');cl.style.width=drag.w+'px';cl.style.left=r.left+'px';cl.style.top=r.top+'px';
    document.body.appendChild(cl);drag.clone=cl;drag.el.classList.add('ghost');}
  drag.clone.style.left=(e.clientX-drag.dx)+'px';drag.clone.style.top=(e.clientY-drag.dy)+'px';
  drag.clone.style.display='none';const u=document.elementFromPoint(e.clientX,e.clientY);drag.clone.style.display='';
  const over=u&&u.closest('.chip,.header');
  if(over&&over.dataset.id!==drag.id){
    const b=over.getBoundingClientRect();
    const after=over.classList.contains('header')?(e.clientY>b.top+b.height/2):(e.clientX>b.left+b.width/2);
    const from=items.findIndex(x=>x.id===drag.id);const [m]=items.splice(from,1);
    let to=items.findIndex(x=>x.id===over.dataset.id);if(after)to++;items.splice(to,0,m);render();
    drag.el=document.querySelector(`[data-id="${drag.id}"]`);if(drag.el)drag.el.classList.add('ghost');
  }
}
async function onUp(){
  if(!drag)return;window.removeEventListener('pointermove',onMove);window.removeEventListener('pointerup',onUp);
  if(drag.clone)drag.clone.remove();
  const el=document.querySelector(`[data-id="${drag.id}"]`);if(el)el.classList.remove('ghost');
  const moved=drag.moved;drag=null;
  if(moved){await persist();if(el){el.dataset.dragged='1';setTimeout(()=>{delete el.dataset.dragged;},50);}}
}

addBtn.addEventListener('click',submitApp);
document.getElementById('sectionBtn').addEventListener('click',addSection);
[title,url].forEach(el=>el.addEventListener('keydown',e=>{if(e.key==='Enter')submitApp();}));

let isSignUp=false;

// === AUTH SETUP ===
async function checkAuth(){
  const{data:{session}}=await sb.auth.getSession();
  if(!session){
    document.getElementById('login-screen').style.display='flex';
    document.getElementById('app-screen').style.display='none';
  }else{
    document.getElementById('login-screen').style.display='none';
    document.getElementById('app-screen').style.display='block';
    initApp();
  }
}

document.getElementById('login-form').addEventListener('submit',async(e)=>{
  e.preventDefault();
  const email=document.getElementById('login-email').value;
  const password=document.getElementById('login-password').value;
  const error=document.getElementById('login-error');
  const btn=e.target.querySelector('button[type="submit"]');
  btn.style.opacity='0.6';
  
  try{
    if(isSignUp){
      const{error:err}=await sb.auth.signUp({email,password});
      if(err)throw err;
      error.style.color='#d9542b';
      error.textContent='Account created! Sign in now.';
      isSignUp=false;
      document.getElementById('signup-toggle').textContent='Create Account';
    }else{
      const{error:err}=await sb.auth.signInWithPassword({email,password});
      if(err)throw err;
      checkAuth();
    }
  }catch(err){
    error.textContent=err.message;
  }finally{
    btn.style.opacity='1';
  }
});

document.getElementById('signup-toggle').addEventListener('click',()=>{
  isSignUp=!isSignUp;
  document.getElementById('signup-toggle').textContent=isSignUp?'Back to Sign In':'Create Account';
});

document.getElementById('logout-btn').addEventListener('click',async()=>{
  await sb.auth.signOut();
  location.reload();
});

// === APP INITIALIZATION ===
async function initApp(){
  const{data:{user}}=await sb.auth.getUser();
  if(!user){console.error('No user');return;}
  console.log('User:',user.id);
  
  const{data:dbApps,error}=await sb.from('launcher_apps').select('*').eq('user_id',user.id).order('order_idx');
  console.log('Query error:',error);
  console.log('Data loaded:',dbApps);
  
  if(error){
    console.error('Load error:',error);
    return;
  }
  
  // Load data from Supabase into the app
  items = dbApps || [];
  console.log('Items set to:',items);
  
  // Render the UI
  render();
  console.log('Rendered');
}

checkAuth();
initApp();
</script>

</body>
</html>
