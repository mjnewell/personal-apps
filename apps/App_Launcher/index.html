<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workshop — App Launcher</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:#f1efe8;color:#1c1e22}
#login-screen{display:flex;position:fixed;inset:0;background:rgba(0,0,0,0.7);align-items:center;justify-content:center;z-index:9999}
#app-screen{display:none}
.wrap{max-width:1000px;margin:0 auto;padding:48px 24px}
h1{margin:20px 0 10px;font-size:32px}
p{color:#73706a;margin-bottom:20px}
.composer{display:flex;gap:10px;margin-bottom:26px}
input{flex:1;padding:12px 14px;border:1px solid #e3ddd0;border-radius:8px;font-size:15px;font-family:'DM Sans'}
input:focus{outline:none;border-color:#d9542b}
button{padding:12px 20px;border:none;border-radius:8px;cursor:pointer;font-weight:600;font-family:'DM Sans'}
#addBtn{background:#1c1e22;color:white}
#sectionBtn{background:white;border:1px dashed #e3ddd0;color:#73706a}
#board{display:flex;flex-direction:column;gap:8px}
.chip{display:flex;gap:10px;align-items:center;background:white;border:1px solid #e3ddd0;border-radius:12px;padding:12px;cursor:pointer}
.chip-info{flex:1}
.chip-title{font-weight:600;font-size:15px}
.chip-host{font-size:12px;color:#73706a}
.login-box{background:white;border-radius:12px;padding:40px;width:90%;max-width:360px}
.login-box h1{font-size:24px;margin:0 0 12px;font-family:'DM Sans'}
.login-box p{margin-bottom:20px;font-size:14px;color:#73706a}
#login-form{display:flex;flex-direction:column;gap:12px}
#login-form input{font-family:'DM Sans'}
#login-form button{width:100%;font-family:'DM Sans'}
#logout-btn{position:fixed;top:16px;right:16px;padding:8px 16px;background:#d9542b;color:white;border:none;border-radius:6px;font-weight:600;cursor:pointer;z-index:1000;font-family:'DM Sans'}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <h1>Workshop</h1>
    <p>Sign in to access your apps</p>
    <form id="login-form">
      <input id="login-email" type="email" placeholder="Email" required>
      <input id="login-password" type="password" placeholder="Password" required>
      <button type="submit" id="signin-btn">Sign In</button>
      <button type="button" id="signup-toggle">Create Account</button>
      <div id="login-error" style="color:#c0492f;font-size:13px;min-height:20px"></div>
    </form>
  </div>
</div>

<div id="app-screen">
  <button id="logout-btn">Logout</button>
  <div class="wrap">
    <h1>App Launcher</h1>
    <p>Add apps, drag to organize.</p>
    <div class="composer">
      <input id="title" type="text" placeholder="App name">
      <input id="url" type="text" placeholder="https://…">
      <button id="addBtn">Add</button>
      <button id="sectionBtn">+ Section</button>
    </div>
    <div id="board"></div>
  </div>
</div>

<script>
const sb=supabase.createClient('https://avbwykhmzuvtglqmkaqu.supabase.co','sb_publishable_0Fpu06kWZrWBuX6rQsFNpQ_zw7oxZA6');
let items=[];
let isSignUp=false;
let currentUserId=null;

function render(){
  const board=document.getElementById('board');
  board.innerHTML='';
  if(!items.length){
    board.innerHTML='<div style="padding:50px;text-align:center;color:#73706a">Nothing yet — add an app above ↑</div>';
    return;
  }
  items.forEach((item,idx)=>{
    const el=document.createElement('div');
    if(item.type==='header'){
      el.innerHTML=`<div style="width:100%;padding:10px 0;font-weight:600;margin-top:10px">${item.title}</div>`;
    }else{
      el.className='chip';
      try{
        const host=new URL(item.url).hostname.replace(/^www\./,'');
        el.innerHTML=`<div class="chip-info"><div class="chip-title">${item.title}</div><div class="chip-host">${host}</div></div><button onclick="editApp(${idx})" style="background:none;border:none;cursor:pointer;padding:4px 8px;color:#73706a;font-size:12px">edit</button><button onclick="delApp(${idx})" style="background:none;border:none;cursor:pointer;padding:4px 8px;color:#73706a;font-size:12px">delete</button>`;
        el.onclick=e=>{if(!e.target.closest('button'))window.open(item.url,'_blank');};
      }catch{
        el.innerHTML=`<div class="chip-info"><div class="chip-title">${item.title}</div><div class="chip-host" style="color:#c0492f">Invalid URL</div></div>`;
      }
    }
    board.appendChild(el);
  });
}

window.editApp=(idx)=>{
  const item=items[idx];
  if(item){
    document.getElementById('title').value=item.title;
    document.getElementById('url').value=item.url||'';
  }
};

window.delApp=(idx)=>{
  if(confirm('Delete this app?')){
    items.splice(idx,1);
    save();
    render();
  }
};

async function save(){
  if(!currentUserId)return;
  try{
    const ops=[];
    for(let i=0;i<items.length;i++){
      const item=items[i];
      item.user_id=currentUserId;
      item.order_idx=i;
      item.is_section=item.type==='header';
      if(!item.id)item.id=crypto.randomUUID();
      ops.push(sb.from('launcher_apps').upsert(item));
    }
    await Promise.all(ops);
  }catch(e){console.error('Save failed:',e);}
}

async function load(){
  if(!currentUserId)return;
  try{
    const{data}=await sb.from('launcher_apps').select('*').eq('user_id',currentUserId).order('order_idx');
    items=data?.map(a=>({...a,type:a.is_section?'header':'app'}))||[];
    render();
  }catch(e){console.error('Load failed:',e);}
}

document.getElementById('login-form').addEventListener('submit',async(e)=>{
  e.preventDefault();
  const email=document.getElementById('login-email').value;
  const password=document.getElementById('login-password').value;
  const errorEl=document.getElementById('login-error');
  errorEl.textContent='';
  
  try{
    if(isSignUp){
      const{error}=await sb.auth.signUp({email,password});
      if(error)throw error;
      errorEl.textContent='✓ Account created! Sign in now.';
      isSignUp=false;
      document.getElementById('signup-toggle').textContent='Create Account';
    }else{
      const{error,data}=await sb.auth.signInWithPassword({email,password});
      if(error)throw error;
      currentUserId=data.user.id;
      document.getElementById('login-screen').style.display='none';
      document.getElementById('app-screen').style.display='block';
      document.getElementById('title').focus();
      load();
    }
  }catch(e){
    errorEl.textContent=e.message||'Error';
  }
});

document.getElementById('signup-toggle').addEventListener('click',()=>{
  isSignUp=!isSignUp;
  document.getElementById('signup-toggle').textContent=isSignUp?'Back to Sign In':'Create Account';
  document.getElementById('login-error').textContent='';
});

document.getElementById('logout-btn').addEventListener('click',async()=>{
  await sb.auth.signOut();
  items=[];
  currentUserId=null;
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('app-screen').style.display='none';
  document.getElementById('login-email').value='';
  document.getElementById('login-password').value='';
  document.getElementById('login-form').style.display='flex';
});

document.getElementById('addBtn').addEventListener('click',()=>{
  const title=document.getElementById('title').value.trim();
  const url=document.getElementById('url').value.trim();
  if(!title||!url)return;
  items.push({id:crypto.randomUUID(),type:'app',title,url});
  document.getElementById('title').value='';
  document.getElementById('url').value='';
  document.getElementById('title').focus();
  save();
  render();
});

document.getElementById('sectionBtn').addEventListener('click',()=>{
  items.push({id:crypto.randomUUID(),type:'header',title:'New section'});
  save();
  render();
});
</script>
</body>
</html>
