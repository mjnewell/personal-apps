<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>App Launcher</title>
<style>
body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 20px; }
.container { max-width: 600px; margin: 0 auto; }
h1 { font-size: 24px; margin-bottom: 20px; }
.input-row { display: flex; gap: 10px; margin-bottom: 20px; }
input { padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 16px; }
input[type="text"] { flex: 1; }
button { padding: 10px 20px; background: #000; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
button:hover { background: #333; }
#board { display: flex; flex-direction: column; gap: 10px; }
.app { background: white; padding: 15px; border: 1px solid #ddd; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
.app-name { font-weight: bold; }
.app-url { font-size: 12px; color: #666; }
</style>
</head>
<body>

<div class="container">
  <h1>App Launcher</h1>
  
  <div class="input-row">
    <input type="text" id="title" placeholder="App name">
    <input type="text" id="url" placeholder="https://example.com">
    <button onclick="addApp()">Add</button>
  </div>
  
  <div id="board"></div>
</div>

<script>
let apps = JSON.parse(localStorage.getItem('apps')) || [];

function render() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  
  if (apps.length === 0) {
    board.innerHTML = '<div style="color: #999; padding: 20px; text-align: center;">No apps yet. Add one above.</div>';
    return;
  }
  
  apps.forEach((app, idx) => {
    const el = document.createElement('div');
    el.className = 'app';
    el.innerHTML = `
      <div>
        <div class="app-name">${app.title}</div>
        <div class="app-url">${app.url}</div>
      </div>
      <div>
        <button onclick="delApp(${idx})" style="background:#d9542b;padding:5px 10px;margin-left:10px">Delete</button>
      </div>
    `;
    el.style.cursor = 'pointer';
    el.addEventListener('click', e => {
      if (!e.target.closest('button')) {
        window.open(app.url, '_blank');
      }
    });
    board.appendChild(el);
  });
}

function addApp() {
  const title = document.getElementById('title').value.trim();
  const url = document.getElementById('url').value.trim();
  
  if (!title || !url) {
    alert('Please fill in both fields');
    return;
  }
  
  apps.push({ title, url });
  localStorage.setItem('apps', JSON.stringify(apps));
  
  document.getElementById('title').value = '';
  document.getElementById('url').value = '';
  document.getElementById('title').focus();
  
  render();
}

function delApp(idx) {
  if (confirm('Delete this app?')) {
    apps.splice(idx, 1);
    localStorage.setItem('apps', JSON.stringify(apps));
    render();
  }
}

render();
document.getElementById('title').focus();
</script>

</body>
</html>
